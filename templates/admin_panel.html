<!-- ADD QUESTION PAPER -->

<div class="card">

    <h2>📄 Add Question Paper</h2>

    <form action="{{ url_for('add_question_paper') }}" method="POST">

        <input
            type="text"
            name="title"
            placeholder="Question Paper Title"
            required
        >

        <input
            type="text"
            name="subject"
            placeholder="Subject"
            required
        >

        <input
            type="text"
            name="year"
            placeholder="Year"
            required
        >

        <br><br>

        <textarea
            name="questions"
            placeholder="Enter questions here...

Example:

1. What is Python?

2. Explain Flask.

3. What is Database?

4. What is HTML?"
            required
            style="width:100%; min-height:250px; padding:15px; border:1px solid #ccc; border-radius:5px; font-size:16px;"
        ></textarea>

        <br><br>

        <button type="submit">
            ➕ Add Question Paper
        </button>

    </form>

</div>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Question Paper | JAY-STUDY</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: #1e3a5f;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            min-height: 350px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button,
        .back-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #1e3a5f;
            color: white;
        }

        button:hover {
            background: #162d49;
        }

        .back-btn {
            background: #777;
            color: white;
        }

        .back-btn:hover {
            background: #555;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            .back-btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="header">

        <h1>JAY-STUDY</h1>

        <p>Edit Question Paper</p>

    </div>


    <div class="container">

        <h2>Edit Question Paper</h2>


        <form method="POST">

            <label>Question Paper Title</label>

            <input
                type="text"
                name="title"
                value="{{ paper.title }}"
                required
            >


            <label>Subject</label>

            <input
                type="text"
                name="subject"
                value="{{ paper.subject }}"
                required
            >


            <label>Year</label>

            <input
                type="text"
                name="year"
                value="{{ paper.year }}"
                required
            >


            <label>Questions</label>

            <textarea
                name="questions"
                required
            >{{ paper.questions }}</textarea>


            <div class="buttons">

                <button type="submit">
                    Update Question Paper
                </button>


                <a
                    href="{{ url_for('admin_panel') }}"
                    class="back-btn"
                >
                    Cancel / Back
                </a>

            </div>

        </form>

    </div>

</body>

</html>

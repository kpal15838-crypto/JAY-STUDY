<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Test | JAY-STUDY</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .question-box {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .question-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e3a5f;
            margin-bottom: 10px;
        }

        button,
        .back-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .save-btn {
            background: #1e3a5f;
            color: white;
            margin-top: 20px;
        }

        .add-btn {
            background: #198754;
            color: white;
            margin-top: 20px;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            margin-top: 15px;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            margin-left: 10px;
            margin-top: 20px;
        }

        @media (max-width: 700px) {

            .section {
                padding: 18px;
            }

        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Edit Test</h1>

        <p>
            Update Test Details and Questions
        </p>

    </div>


    <div class="container">

        <div class="section">

            <form method="POST">

                <label>Test Title</label>

                <input
                    type="text"
                    name="title"
                    value="{{ test.title }}"
                    required
                >


                <label>Subject</label>

                <input
                    type="text"
                    name="subject"
                    value="{{ test.subject }}"
                    required
                >


                <div id="questions-container">

                    {% for question in questions %}

                    <div class="question-box">

                        <div class="question-title">

                            Question {{ loop.index }}

                        </div>


                        <input
                            type="hidden"
                            name="question_id[]"
                            value="{{ question.id }}"
                        >


                        <label>Question</label>

                        <textarea
                            name="question[]"
                            required
                        >{{ question.question }}</textarea>


                        <label>Option A</label>

                        <input
                            type="text"
                            name="option_a[]"
                            value="{{ question.option_a }}"
                            required
                        >


                        <label>Option B</label>

                        <input
                            type="text"
                            name="option_b[]"
                            value="{{ question.option_b }}"
                            required
                        >


                        <label>Option C</label>

                        <input
                            type="text"
                            name="option_c[]"
                            value="{{ question.option_c }}"
                            required
                        >


                        <label>Option D</label>

                        <input
                            type="text"
                            name="option_d[]"
                            value="{{ question.option_d }}"
                            required
                        >


                        <label>Correct Answer</label>

                        <select
                            name="correct_answer[]"
                            required
                        >

                            <option
                                value="A"
                                {% if question.correct_answer == "A" %}
                                selected
                                {% endif %}
                            >
                                A
                            </option>

                            <option
                                value="B"
                                {% if question.correct_answer == "B" %}
                                selected
                                {% endif %}
                            >
                                B
                            </option>

                            <option
                                value="C"
                                {% if question.correct_answer == "C" %}
                                selected
                                {% endif %}
                            >
                                C
                            </option>

                            <option
                                value="D"
                                {% if question.correct_answer == "D" %}
                                selected
                                {% endif %}
                            >
                                D
                            </option>

                        </select>


                        <button
                            type="button"
                            class="remove-btn"
                            onclick="removeQuestion(this)"
                        >
                            Remove Question
                        </button>

                    </div>

                    {% endfor %}

                </div>


                <button
                    type="button"
                    class="add-btn"
                    onclick="addQuestion()"
                >
                    + Add New Question
                </button>


                <br>


                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>


                <a
                    href="{{ url_for('admin_panel') }}"
                    class="back-btn"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>


    <script>

        function addQuestion() {

            const container =
                document.getElementById(
                    "questions-container"
                );

            const questionNumber =
                container.children.length + 1;


            const questionHTML = `

                <div class="question-box">

                    <div class="question-title">

                        Question ${questionNumber}

                    </div>


                    <input
                        type="hidden"
                        name="question_id[]"
                        value=""
                    >


                    <label>Question</label>

                    <textarea
                        name="question[]"
                        required
                    ></textarea>


                    <label>Option A</label>

                    <input
                        type="text"
                        name="option_a[]"
                        required
                    >


                    <label>Option B</label>

                    <input
                        type="text"
                        name="option_b[]"
                        required
                    >


                    <label>Option C</label>

                    <input
                        type="text"
                        name="option_c[]"
                        required
                    >


                    <label>Option D</label>

                    <input
                        type="text"
                        name="option_d[]"
                        required
                    >


                    <label>Correct Answer</label>

                    <select
                        name="correct_answer[]"
                        required
                    >

                        <option value="A">
                            A
                        </option>

                        <option value="B">
                            B
                        </option>

                        <option value="C">
                            C
                        </option>

                        <option value="D">
                            D
                        </option>

                    </select>


                    <button
                        type="button"
                        class="remove-btn"
                        onclick="removeQuestion(this)"
                    >
                        Remove Question
                    </button>

                </div>
            `;


            container.insertAdjacentHTML(
                "beforeend",
                questionHTML
            );

        }


        function removeQuestion(button) {

            const container =
                document.getElementById(
                    "questions-container"
                );


            if (
                container.children.length <= 1
            ) {

                alert(
                    "At least one question is required!"
                );

                return;

            }


            button
                .closest(".question-box")
                .remove();


            updateQuestionNumbers();

        }


        function updateQuestionNumbers() {

            const boxes =
                document.querySelectorAll(
                    "#questions-container .question-box"
                );


            boxes.forEach(
                function(box, index) {

                    const title =
                        box.querySelector(
                            ".question-title"
                        );

                    title.innerText =
                        "Question " + (index + 1);

                }
            );

        }

    </script>

</body>

</html>

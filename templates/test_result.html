<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Test Result | JAY-STUDY</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .result-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        .test-title {
            color: #1e3a8a;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .subject {
            color: #666;
            margin-bottom: 25px;
        }

        .percentage {
            font-size: 50px;
            font-weight: bold;
            color: #16a34a;
            margin: 20px 0;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        .result-table th,
        .result-table td {
            padding: 14px;
            border: 1px solid #ddd;
        }

        .result-table th {
            background: #1e3a8a;
            color: white;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 22px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #172554;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>📚 JAY-STUDY Test Result</h1>

    </div>


    <div class="container">

        <div class="result-card">

            <h2 class="test-title">
                {{ result.title }}
            </h2>

            <p class="subject">
                Subject: {{ result.subject }}
            </p>


            <h3>Your Score</h3>

            <div class="percentage">
                {{ result.percentage }}%
            </div>


            <table class="result-table">

                <tr>
                    <th>Total Questions</th>
                    <td>{{ result.total_questions }}</td>
                </tr>

                <tr>
                    <th>Correct Answers</th>
                    <td>{{ result.correct_answers }}</td>
                </tr>

                <tr>
                    <th>Wrong Answers</th>
                    <td>{{ result.wrong_answers }}</td>
                </tr>

            </table>


            <a href="/user-panel"
               class="back-btn">

                ← Back to User Panel

            </a>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Test | JAY-STUDY</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #1e3a5f;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e3a5f;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .question-box {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .question-title {
            color: #1e3a5f;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button,
        .back-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .save-btn {
            background: #1e3a5f;
            color: white;
        }

        .save-btn:hover {
            background: #162d49;
        }

        .add-btn {
            background: #198754;
            color: white;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            margin-top: 15px;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 18px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            .back-btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="header">

        <h1>JAY-STUDY</h1>

        <p>Edit Test</p>

    </div>


    <div class="container">

        <h2>Edit Test</h2>


        <form method="POST">

            <label>Test Title</label>

            <input
                type="text"
                name="title"
                value="{{ test.title }}"
                required
            >


            <label>Subject</label>

            <input
                type="text"
                name="subject"
                value="{{ test.subject }}"
                required
            >


            <div id="questions-container">

                {% for question in questions %}

                <div class="question-box">

                    <div class="question-title">
                        Question {{ loop.index }}
                    </div>


                    <label>Question</label>

                    <textarea
                        name="question[]"
                        required
                    >{{ question.question }}</textarea>


                    <label>Option A</label>

                    <input
                        type="text"
                        name="option_a[]"
                        value="{{ question.option_a }}"
                        required
                    >


                    <label>Option B</label>

                    <input
                        type="text"
                        name="option_b[]"
                        value="{{ question.option_b }}"
                        required
                    >


                    <label>Option C</label>

                    <input
                        type="text"
                        name="option_c[]"
                        value="{{ question.option_c }}"
                        required
                    >


                    <label>Option D</label>

                    <input
                        type="text"
                        name="option_d[]"
                        value="{{ question.option_d }}"
                        required
                    >


                    <label>Correct Answer</label>

                    <select
                        name="correct_answer[]"
                        required
                    >

                        <option
                            value="A"
                            {% if question.correct_answer == "A" %}
                            selected
                            {% endif %}
                        >
                            A
                        </option>

                        <option
                            value="B"
                            {% if question.correct_answer == "B" %}
                            selected
                            {% endif %}
                        >
                            B
                        </option>

                        <option
                            value="C"
                            {% if question.correct_answer == "C" %}
                            selected
                            {% endif %}
                        >
                            C
                        </option>

                        <option
                            value="D"
                            {% if question.correct_answer == "D" %}
                            selected
                            {% endif %}
                        >
                            D
                        </option>

                    </select>


                    <button
                        type="button"
                        class="delete-btn"
                        onclick="removeQuestion(this)"
                    >
                        Remove Question
                    </button>

                </div>

                {% endfor %}

            </div>


            <div class="buttons">

                <button
                    type="button"
                    class="add-btn"
                    onclick="addQuestion()"
                >
                    + Add New Question
                </button>


                <button
                    type="submit"
                    class="save-btn"
                >
                    Update Test
                </button>


                <a
                    href="{{ url_for('admin_panel') }}"
                    class="back-btn"
                >
                    Cancel / Back
                </a>

            </div>

        </form>

    </div>


    <script>

        function addQuestion() {

            const container =
                document.getElementById(
                    "questions-container"
                );

            const number =
                container.children.length + 1;

            const questionHTML = `

                <div class="question-box">

                    <div class="question-title">
                        Question ${number}
                    </div>

                    <label>Question</label>

                    <textarea
                        name="question[]"
                        required
                    ></textarea>


                    <label>Option A</label>

                    <input
                        type="text"
                        name="option_a[]"
                        required
                    >


                    <label>Option B</label>

                    <input
                        type="text"
                        name="option_b[]"
                        required
                    >


                    <label>Option C</label>

                    <input
                        type="text"
                        name="option_c[]"
                        required
                    >


                    <label>Option D</label>

                    <input
                        type="text"
                        name="option_d[]"
                        required
                    >


                    <label>Correct Answer</label>

                    <select
                        name="correct_answer[]"
                        required
                    >

                        <option value="A">
                            A
                        </option>

                        <option value="B">
                            B
                        </option>

                        <option value="C">
                            C
                        </option>

                        <option value="D">
                            D
                        </option>

                    </select>


                    <button
                        type="button"
                        class="delete-btn"
                        onclick="removeQuestion(this)"
                    >
                        Remove Question
                    </button>

                </div>
            `;

            container.insertAdjacentHTML(
                "beforeend",
                questionHTML
            );

        }


        function removeQuestion(button) {

            const container =
                document.getElementById(
                    "questions-container"
                );

            if (
                container.children.length <= 1
            ) {

                alert(
                    "At least one question is required!"
                );

                return;
            }

            button
                .closest(".question-box")
                .remove();

            updateQuestionNumbers();

        }


        function updateQuestionNumbers() {

            const boxes =
                document.querySelectorAll(
                    ".question-box"
                );

            boxes.forEach(
                function(box, index) {

                    const title =
                        box.querySelector(
                            ".question-title"
                        );

                    title.innerText =
                        "Question " + (index + 1);

                }
            );

        }

    </script>

</body>

</html>
